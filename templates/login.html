<!DOCTYPE html>
<html>
<head>
    <title>Login - Cloud Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-left">
            <div class="star"></div><div class="star"></div><div class="star"></div>
            <div class="star"></div><div class="star"></div><div class="star"></div>
            <div class="star"></div><div class="star"></div><div class="star"></div>
            <div class="star"></div><div class="star"></div><div class="star"></div>
            <div class="shooting-star"></div>
            <h2>☁️ Cloud Task Manager</h2>
            <p>Sign in to manage your tasks</p>
        </div>
        <div class="auth-right">
            <p class="greeting-small">Hello!</p>
            <h1 id="greeting">Welcome Back</h1>
            <h3>Login <span>Your Account</span></h3>
            <form method="POST">
                <input type="email" name="email" placeholder="Email Address" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">LOG IN</button>
            </form>
            <p class="switch-link">No account? <a href="/signup">Sign up</a></p>
        </div>
    </div>

    <script>
        const hour = new Date().getHours();
        let greetingText = "Good Evening";
        if (hour < 12) {
            greetingText = "Good Morning";
        } else if (hour < 17) {
            greetingText = "Good Afternoon";
        }
        document.getElementById("greeting").textContent = greetingText;
    </script>
</body>
</html>s
